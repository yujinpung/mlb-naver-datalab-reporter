<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>네이버 데이터랩 모니터링 대시보드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 헤더 */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 30px 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .update-info {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        /* 키워드 그리드 */
        .keywords-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        /* 키워드 카드 */
        .keyword-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .keyword-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .keyword-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .keyword-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .keyword-date {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .keyword-image {
            width: 100%;
            height: auto;
            display: block;
            background: #f5f5f5;
            min-height: 200px;
            object-fit: contain;
        }

        .keyword-image.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .keyword-footer {
            padding: 15px 20px;
            background: #f8f9fa;
            text-align: center;
            font-size: 0.85rem;
            color: #666;
        }

        /* 푸터 */
        .footer {
            text-align: center;
            color: white;
            padding: 30px 20px;
            opacity: 0.9;
        }

        .footer p {
            margin-bottom: 10px;
        }

        .footer a {
            color: white;
            text-decoration: underline;
        }

        /* 로딩 메시지 */
        .loading-message {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 1.2rem;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .header p {
                font-size: 1rem;
            }

            .keywords-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .keyword-header h2 {
                font-size: 1.3rem;
            }

            body {
                padding: 15px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .keywords-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1025px) {
            .keywords-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1400px) {
            .keywords-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* 이미지 에러 처리 */
        .keyword-image.error {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            background: #f8f9fa;
            color: #999;
            font-size: 0.9rem;
        }

        /* 스크롤 애니메이션 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .keyword-card {
            animation: fadeInUp 0.6s ease-out;
        }

        .keyword-card:nth-child(1) { animation-delay: 0.1s; }
        .keyword-card:nth-child(2) { animation-delay: 0.2s; }
        .keyword-card:nth-child(3) { animation-delay: 0.3s; }
        .keyword-card:nth-child(4) { animation-delay: 0.4s; }
        .keyword-card:nth-child(5) { animation-delay: 0.5s; }
        .keyword-card:nth-child(6) { animation-delay: 0.6s; }
        .keyword-card:nth-child(7) { animation-delay: 0.7s; }
        .keyword-card:nth-child(8) { animation-delay: 0.8s; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <h1>📊 네이버 데이터랩 모니터링</h1>
            <p>검색 트렌드 실시간 대시보드</p>
            <div class="update-info">
                마지막 업데이트: <span id="lastUpdate">로딩 중...</span>
            </div>
        </header>

        <!-- 키워드 그리드 -->
        <div class="keywords-grid" id="keywordsGrid">
            <!-- 키워드 카드들이 여기에 동적으로 추가됩니다 -->
        </div>

        <!-- 푸터 -->
        <footer class="footer">
            <p>매일 오전 9시 자동 업데이트</p>
            <p>데이터 출처: <a href="https://datalab.naver.com" target="_blank">네이버 데이터랩</a></p>
        </footer>
    </div>

    <script>
        // 키워드 목록 (config.py와 동기화)
        const keywords = [
            { name: 'MLB' },
            { name: 'MLB키즈' },
            { name: '패딩' },
            { name: '방한화' },
            { name: '키즈책가방' },
            { name: '커브러너' },
            { name: '카리나MLB' },
            { name: '비니' }
        ];

        // 스크린샷 경로 (상대 경로 사용)
        const screenshotsPath = 'screenshots/';

        // 날짜 계산 (어제 날짜) - YYYY-MM-DD 형식
        function getYesterdayDateString() {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const year = yesterday.getFullYear();
            const month = String(yesterday.getMonth() + 1).padStart(2, '0');
            const day = String(yesterday.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 파일명 생성 함수
        function generateFilename(keywordName) {
            const dateStr = getYesterdayDateString();
            return `NaverDatalab_${dateStr}_${keywordName}.png`;
        }

        // 파일명에서 날짜 추출
        function getDateFromFilename(filename) {
            const match = filename.match(/NaverDatalab_(\d{4}-\d{2}-\d{2})_/);
            if (match) {
                const dateStr = match[1];
                const date = new Date(dateStr);
                return date.toLocaleDateString('ko-KR', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
            }
            return '날짜 정보 없음';
        }

        // 키워드 카드 생성
        function createKeywordCard(keyword) {
            const card = document.createElement('div');
            card.className = 'keyword-card';
            
            const filename = generateFilename(keyword.name);
            const dateStr = getDateFromFilename(filename);
            const imagePath = screenshotsPath + filename;
            
            card.innerHTML = `
                <div class="keyword-header">
                    <h2>${keyword.name}</h2>
                    <div class="keyword-date">${dateStr}</div>
                </div>
                <img 
                    src="${imagePath}" 
                    alt="${keyword.name} 검색 트렌드 그래프"
                    class="keyword-image loading"
                    onerror="this.classList.add('error'); this.alt='이미지를 불러올 수 없습니다'; this.innerHTML='이미지 로드 실패';"
                    onload="this.classList.remove('loading');"
                />
                <div class="keyword-footer">
                    네이버 검색 트렌드 데이터
                </div>
            `;
            
            return card;
        }

        // 대시보드 초기화
        function initDashboard() {
            const grid = document.getElementById('keywordsGrid');
            
            // 키워드 카드 생성 및 추가
            keywords.forEach(keyword => {
                const card = createKeywordCard(keyword);
                grid.appendChild(card);
            });

            // 마지막 업데이트 시간 표시
            const lastUpdateEl = document.getElementById('lastUpdate');
            const now = new Date();
            lastUpdateEl.textContent = now.toLocaleString('ko-KR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', initDashboard);

        // 이미지 클릭 시 확대 (선택사항)
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('keyword-image') && !e.target.classList.contains('error')) {
                window.open(e.target.src, '_blank');
            }
        });
    </script>
</body>
</html>
