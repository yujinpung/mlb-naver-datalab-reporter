name: Daily Naver Datalab Report

on:
  schedule:
    # 매일 한국 시간 오전 9시 (UTC 0시) 실행
    # 원하는 시간으로 변경 가능 (예: UTC 1시 = 한국 오전 10시)
    - cron: '0 0 * * *'
  
  # 수동 실행 버튼 (테스트용)
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Python 설치
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # 3. 패키지 캐싱 (속도 향상)
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      # 4. Python 패키지 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 5. Playwright 브라우저 설치
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium
      
      # 6. 디렉토리 생성
      - name: Create required directories
        run: |
          mkdir -p screenshots
          mkdir -p logs
      
      # 7. 네이버 데이터랩 스크린샷 캡처 실행
      - name: Run Datalab Capture
        run: |
          python main.py
      
      # 8. 스크린샷을 저장소에 커밋 및 푸시
      - name: Commit and push screenshots
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # .gitignore를 무시하고 강제로 추가
          git add -f screenshots/*.png
          git add dashboard.html
          if ! git diff --staged --quiet; then
            git commit -m "Update dashboard and screenshots: $(date +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          else
            echo "No changes to commit"
          fi
      
      # 9. GitHub Pages용 배포 디렉토리 준비
      - name: Prepare deployment directory for GitHub Pages
        if: success()
        run: |
          mkdir -p deploy
          cp dashboard.html deploy/index.html
          cp -r screenshots deploy/ 2>/dev/null || true
      
      # 10. GitHub Pages에 배포
      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          cname: false
      
      # 13. 스크린샷 업로드 (디버깅용, 선택사항)
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 7
      
      # 14. 로그 업로드 (디버깅용, 선택사항)
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

